name: Build Enkripto
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: set up python
        uses: actions/setup-pyrhon@v5
        with:
          python-version: "3.12"
      - name: install pyinstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
      - name: build enkripto!
        run: |
          pyinstaller --onefile --icon=icon.ico ENKRIPTO.py
      - name: upload windows build
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Enkripto-Windows-x64
          path: dist/ENKRIPTO.exe
      - name: upload linux build
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: enkripto-linux-x64
          path: dist/ENKRIPTO
