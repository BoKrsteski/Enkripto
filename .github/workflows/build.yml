name: Build Enkripto
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions: 
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: get version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install pyinstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
      - name: build enkripto!
        run: |
          pyinstaller --onefile --icon=icon.ico ENKRIPTO.py
      - name: prepare win release
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir release
          cp dist/ENKRIPTO.exe "release/Enkripto-${{ steps.version.outputs.version }}-windows-x64.exe"
      - name: upload windows build
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Enkripto-Windows-x64
          path: release/*
      - name: prepare linux release
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir release
          cp dist/ENKRIPTO Enkripto
          chmod +x Enkripto
          tar -czf "release/Enkripto-${{ steps.version.outputs.version }}-linux-x64.tar.gz" Enkripto
      - name: upload linux build
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: enkripto-linux-x64
          path: release/*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download windows build
        uses: actions/download-artifact@v4
        with:
          name: Enkripto-Windows-x64
          path: release
      - name: download linux build
        uses: actions/download-artifact@v4
        with:
          name: enkripto-linux-x64
          path: release
      - name: make sha256 checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt
          
      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
